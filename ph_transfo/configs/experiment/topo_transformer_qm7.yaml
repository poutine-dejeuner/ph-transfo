# @package _global_

# TopoGraphTransformer experiment on QM7 (smallest dataset, ~7k molecules)
# Execute with: python ph_transfo/main.py experiment=topo_transformer_qm7
defaults:
  - override /algorithm: topo_transformer
  - override /datamodule: qm7
  - override /trainer: default

name: topo_transformer_qm7

seed: 42

algorithm:
  optimizer:
    lr: 5e-3
    weight_decay: 1e-4
  lr_scheduler:
    factor: 0.5
    patience: 20
    min_lr: 1e-6

  network:
    hparams:
      hidden_dim: 384
      num_heads: 4
      num_transformer_layers: 3
      ff_mult: 2
      dropout: 0.1
      num_filtrations: 4
      num_dist_filtrations: 4
      filtration_hidden: 32
      coord_funs:
        triangle: 4
        line: 4
      topo_residual_bn: true
      share_filtration_parameters: true
      apply_tanh: false
      topo_every_n_layers: 1
      pooling: mean

datamodule:
  batch_size: 32
  num_workers: 4

trainer:
  min_epochs: 1
  max_epochs: 500
  callbacks:
    rich_progress_bar: null
    throughput: null

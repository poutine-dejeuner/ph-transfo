# @package _global_

# GPS Transformer + topological PE on QM9
# Execute with: python ph_transfo/main.py experiment=gps_topo_qm9
defaults:
  - override /algorithm: gps_topo
  - override /datamodule: qm9
  - override /trainer: default

name: gps_topo_qm9

seed: 42

algorithm:
  optimizer:
    lr: 5e-3
    weight_decay: 1e-4
  lr_scheduler:
    factor: 0.5
    patience: 20
    min_lr: 1e-6

  network:
    hparams:
      hidden_dim: 384
      num_layers: 4
      num_heads: 4
      dropout: 0.1
      attn_dropout: 0.1
      topo_pe_layers: 2
      edge_topo: true

datamodule:
  batch_size: 32
  num_workers: 4
  data:
    topo:
      n_curve_points: 20
      curve_range: [1.0, 6.0]

trainer:
  min_epochs: 1
  max_epochs: 500
  callbacks:
    rich_progress_bar: null
    throughput: null

defaults:
  - network: topo_transformer
  - optimizer: Adam
  - _self_

_target_: reg_transfo.algorithms.basealgo.BaseAlgorithm
_partial_: true
_recursive_: false

optimizer:
  lr: 0.001
  weight_decay: 0.0001

lr_scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.5
  patience: 20
  min_lr: 1e-6
